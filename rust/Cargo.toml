[package]
name = "tiny-agent-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal Rust AI coding agent POC"

[[bin]]
name = "tiny-rs"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
ureq = { version = "3.4", features = ["json"] }
http = "1.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
unicode-width = { version = "0.2", features = ["cjk"] }
