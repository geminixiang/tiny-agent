[package]
name = "tiny-agent-rust"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Minimal Rust AI coding agent POC"

[[bin]]
name = "tiny-rs"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
ureq = { version = "3.4", features = ["json"] }
http = "1"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
unicode-width = { version = "0.2", features = ["cjk"] }
rmcp = { version = "3.2.0", features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[dev-dependencies]
opentelemetry_sdk = { version = "0.32.1", features = ["testing", "trace"] }
