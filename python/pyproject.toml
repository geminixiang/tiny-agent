[project]
name = "tiny-agent-py"
version = "0.1.0"
description = "Minimal Python AI coding agent POC"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "certifi>=2024.8.30",
    "httpx2>=0.1",
    "mcp==2.1.1",
    "pydantic-settings>=2.10,<3",
]

[project.scripts]
tiny-py = "tiny_agent.cli:main"

[build-system]
requires = ["uv_build>=0.9.28,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "tiny_agent"
